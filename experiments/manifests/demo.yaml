# Phase-8 demo manifest. Drives three attacks through the harness
# against the chosen reference server (`--target` flag on the
# CLI). Phase 9 will replace this with a full Phase-9 manifest.

run:
  seed: 42
  repeats: 1
  concurrency: 2

tenants:
  - id: tenant-A
    name: Alice
    allowed_tools: [echo, scratchpad_write, scratchpad_read, cache_lookup, fetch_url]
    allowed_resources: []
  - id: tenant-B
    name: Bob
    allowed_tools: [echo, scratchpad_write, scratchpad_read, cache_lookup, fetch_url]
    allowed_resources: []

attacks:
  - id: A-TRN-S
  - id: A-CCH-T
  - id: A-MEM-T

defenses:
  per_tenant_tool_registry: false
  tenant_prefixed_cache_keys: false
  resource_path_canonicalisation: false
  mtls: false

target:
  transport: dummy
  command: null
  url: null
  token: null

output:
  log_dir: experiments/logs
  output_dir: experiments/outputs
  log_format: jsonl