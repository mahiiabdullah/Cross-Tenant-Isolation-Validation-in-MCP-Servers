# Phase 9 — RQ-1 baseline manifest.
#
# Research Question 1 (RQ-1):
#   Do vulnerable and secure MCP server reference implementations
#   exhibit the predicted isolation failure rate?
#   H1 (vulnerable):    leakage_rate >= 0.70 on cross-tenant attacks.
#   H0 (secure):        leakage_rate <  0.05 on the same attacks.
#
# Design:
#   - Attacks: one representative per boundary (8 total).
#     * T = Tampering (STRIDE letter) is the canonical boundary row.
#   - Servers: vulnerable + secure.
#   - Defenses: none (defaults).
#   - Iterations: 30 (CLT-valid per analysis/power.md).
#
# Cells: 8 attacks × 2 servers × 30 iterations = 480 runs.

run:
  seed: 42
  repeats: 1
  concurrency: 2

tenants:
  - id: tenant-A
    name: Alice
    allowed_tools: [echo, scratchpad_write, scratchpad_read, cache_lookup, fetch_url]
    allowed_resources: []
  - id: tenant-B
    name: Bob
    allowed_tools: [echo, scratchpad_write, scratchpad_read, cache_lookup, fetch_url]
    allowed_resources: []

attacks:
  - id: A-TRN-S    # Transport / Spoofing
  - id: A-SES-T    # Session / Tampering
  - id: A-NSP-T    # Namespace / Tampering
  - id: A-TOL-T    # Tool / Tampering
  - id: A-RES-T    # Resource / Tampering
  - id: A-MEM-T    # Memory / Tampering
  - id: A-CCH-T    # Cache / Tampering
  - id: A-AUT-T    # Auth / Tampering

defenses:
  per_tenant_tool_registry: false
  tenant_prefixed_cache_keys: false
  resource_path_canonicalisation: false
  mtls: false

target:
  transport: dummy
  command: null
  url: null
  token: null

output:
  log_dir: analysis/runs/exp-rq1-baseline/logs
  output_dir: analysis/runs/exp-rq1-baseline
  log_format: jsonl

# Phase-9 cell iteration. Servers and defense levels are
# consumed by `experiments.runner`.
servers: [vulnerable, secure]
defense_levels: [none]
run_id: exp-rq1-baseline
