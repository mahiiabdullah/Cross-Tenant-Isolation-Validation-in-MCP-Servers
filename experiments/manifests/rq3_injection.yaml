# Phase 9 — RQ-3 prompt-injection manifest.
#
# Research Question 3 (RQ-3):
#   Do prompt-injection attacks against MCP tool boundaries yield
#   bounded but non-zero leakage even on hardened servers?
#   H1: leakage_rate on secure server >= 0.05 and <= 0.30
#       for prompt-injection attacks (bounded residual risk).
#
# Design:
#   - Attacks: cross-cutting ResultInjection (A-TOL-001) which
#     smuggles a marker through a tool's response payload, plus all
#     tool-boundary STRIDE rows.
#   - Servers: secure only (the RQ is about residual risk after
#     hardening).
#   - Defenses: none (defaults).
#   - Iterations: 30.
#
# Cells: 1 cross-cutting + 6 tool rows = 7 attacks × 1 server
#        × 30 iterations = 210 runs.

run:
  seed: 42
  repeats: 1
  concurrency: 2

tenants:
  - id: tenant-A
    name: Alice
    allowed_tools: [echo, scratchpad_write, scratchpad_read, cache_lookup, fetch_url]
    allowed_resources: []
  - id: tenant-B
    name: Bob
    allowed_tools: [echo, scratchpad_write, scratchpad_read, cache_lookup, fetch_url]
    allowed_resources: []

attacks:
  - id: A-TOL-001    # Cross-cutting ResultInjection (prompt-injection chain)
  - id: A-TOL-S      # Tool / Spoofing
  - id: A-TOL-T      # Tool / Tampering
  - id: A-TOL-R      # Tool / Repudiation
  - id: A-TOL-I      # Tool / Information disclosure
  - id: A-TOL-D      # Tool / Denial of service
  - id: A-TOL-E      # Tool / Elevation of privilege

defenses:
  per_tenant_tool_registry: false
  tenant_prefixed_cache_keys: false
  resource_path_canonicalisation: false
  mtls: false

target:
  transport: dummy
  command: null
  url: null
  token: null

output:
  log_dir: analysis/runs/exp-rq3-injection/logs
  output_dir: analysis/runs/exp-rq3-injection
  log_format: jsonl

# Phase-9 cell iteration. Servers and defense levels are
# consumed by `experiments.runner`.
servers: [secure]
defense_levels: [none]
run_id: exp-rq3-injection
