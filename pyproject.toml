[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-isolation-research"
version = "0.1.0"
description = "Empirical study of isolation mechanisms in the Model Context Protocol."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "MCP Isolation Research Authors" },
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
analysis = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "plotly>=5.22.0",
    "statsmodels>=0.14.0",
]
fuzz = [
    "atheris>=3.0.0",
    "hypothesis>=6.100.0",
    "promptfoo>=0.40.0",
]

[project.urls]
Documentation = "https://github.com/<org>/mcp-isolation-research"
Source = "https://github.com/<org>/mcp-isolation-research"

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "attacks*", "mcp_servers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["framework", "attacks", "mcp_servers", "tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["analysis/notebooks"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
